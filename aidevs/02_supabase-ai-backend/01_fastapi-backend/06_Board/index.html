<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메모 보드</title>
  <style>
    :root { --blue:#1468ed; --line:#d9dde5; --ink:#15171b; --muted:#747983; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:760px; font-family:"Pretendard","Noto Sans KR",Arial,sans-serif; color:var(--ink); background:linear-gradient(135deg,#f7f9fc 0%,#edf4ff 100%); }
    .page { max-width:1548px; margin:0 auto; padding:42px 48px 64px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    h1 { margin:0; font-size:40px; letter-spacing:-2px; }
    .clock { width:355px; display:flex; justify-content:space-between; align-items:center; padding:20px 28px; background:#fff; border-radius:13px; box-shadow:0 3px 12px #00000018; font-size:24px; font-weight:700; }
    .clock time { color:#1476ed; font-size:29px; }
    .layout { display:grid; grid-template-columns:435px 1fr; gap:38px; }
    .panel { background:#fff; border-radius:14px; box-shadow:0 2px 10px #0000001d; }
    .list-panel { min-height:616px; padding:30px; }
    h2 { margin:0 0 26px; font-size:28px; letter-spacing:-1.3px; }
    #board-list { display:grid; gap:20px; }
    .board-item { width:100%; display:grid; grid-template-columns:44px 1fr 20px; gap:16px; align-items:center; padding:20px; text-align:left; background:#fff; color:inherit; border:1px solid var(--line); border-radius:11px; cursor:pointer; transition:.15s; }
    .board-item:hover { border-color:#9abcfb; background:#f9fbff; }
    .board-item.selected { color:#0b59d8; border:2px solid var(--blue); background:linear-gradient(110deg,#fff 20%,#f0f6ff); padding:19px; }
    .note-icon { width:31px; height:39px; border:3px solid currentColor; border-radius:4px; position:relative; }
    .note-icon::after { content:""; position:absolute; left:6px; right:6px; top:12px; height:3px; background:currentColor; box-shadow:0 8px currentColor; }
    .item-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:20px; font-weight:700; }
    .item-date { margin-top:7px; color:var(--muted); font-size:15px; }
    .arrow { font-size:38px; line-height:1; font-weight:300; }
    .editor { overflow:hidden; min-height:616px; }
    .editor-body { padding:34px 38px 20px; }
    label { display:block; margin:0 0 11px; font-size:18px; font-weight:700; }
    input, textarea { width:100%; border:1px solid #ccd1d9; border-radius:8px; font:inherit; font-size:20px; outline:none; }
    input { height:57px; padding:0 15px; margin-bottom:30px; }
    textarea { min-height:307px; padding:16px; line-height:1.65; resize:vertical; }
    input:focus, textarea:focus { border:2px solid var(--blue); padding:0 14px; }
    textarea:focus { padding:15px; }
    .actions { display:flex; justify-content:flex-end; gap:22px; padding:19px 32px; border-top:1px solid #e8e8e8; }
    button.action { min-width:165px; padding:15px 22px; border:0; border-radius:10px; color:#fff; font-size:22px; font-weight:700; cursor:pointer; }
    #save { background:var(--blue); } #delete { background:#ef3034; } #new { background:#fff; color:var(--blue); border:2px solid var(--blue); }
    button:hover { filter:brightness(.95); } .empty { color:var(--muted); padding:30px 5px; text-align:center; }
    @media (max-width:950px) { .page { padding:28px; } .layout { grid-template-columns:1fr; } .clock { width:280px; } }
  </style>
</head>
<body>
  <main class="page">
    <header><h1>메모 보드</h1><div class="clock"><span>시계추가</span><time id="clock"></time></div></header>
    <section class="layout">
      <aside class="panel list-panel"><h2>기록된 메모들</h2><div id="board-list"></div></aside>
      <section class="panel editor">
        <div class="editor-body"><label for="title">제목</label><input id="title" placeholder="제목을 입력하세요"><label for="content">내용</label><textarea id="content" placeholder="내용을 입력하세요"></textarea></div>
        <div class="actions"><button id="new" class="action">새 글</button><button id="save" class="action">저장하기</button><button id="delete" class="action">삭제</button></div>
      </section>
    </section>
  </main>
  <script>
    const list = document.querySelector('#board-list');
    const title = document.querySelector('#title'); const content = document.querySelector('#content');
    const save = document.querySelector('#save'); const remove = document.querySelector('#delete');
    let selectedId = null; let boards = [];
    const dateText = () => new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(/\. /g,'-').replace('.','');
    function showClock(){ document.querySelector('#clock').textContent = new Date().toLocaleTimeString('en-GB'); }
    function clearEditor(){ selectedId=null; title.value=''; content.value=''; remove.style.display='none'; save.textContent='등록하기'; renderList(); title.focus(); }
    async function loadBoards(){ const response=await fetch('/borads/list'); boards=(await response.json()).data; if(selectedId && !boards.some(b=>b.id===selectedId)) selectedId=null; renderList(); if(selectedId) await selectBoard(selectedId); else if(boards.length) await selectBoard(boards[0].id); else clearEditor(); }
    function renderList(){ list.innerHTML=''; if(!boards.length){ list.innerHTML='<p class="empty">작성된 메모가 없습니다.</p>'; return; } boards.forEach(board=>{ const button=document.createElement('button'); button.className='board-item'+(board.id===selectedId?' selected':''); button.innerHTML=`<span class="note-icon"></span><span><span class="item-title">${escapeHtml(board.title)}</span><span class="item-date">${dateText()}</span></span><span class="arrow">›</span>`; button.onclick=()=>selectBoard(board.id); list.append(button); }); }
    function escapeHtml(value){ const div=document.createElement('div'); div.textContent=value; return div.innerHTML; }
    async function selectBoard(id){ const response=await fetch('/borads/'+id); if(!response.ok) return; const board=(await response.json()).data; selectedId=board.id; title.value=board.title; content.value=board.content; save.textContent='수정하기'; remove.style.display='block'; renderList(); }
    async function saveBoard(){ const body={title:title.value.trim(),content:content.value.trim()}; if(!body.title||!body.content){ alert('제목과 내용을 모두 입력해주세요.'); return; } const url=selectedId?'/borads':'/borads/create'; const method=selectedId?'PUT':'POST'; if(selectedId) body.id=selectedId; const response=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(!response.ok){ alert('저장에 실패했습니다.'); return; } selectedId=(await response.json()).data.id; await loadBoards(); }
    async function deleteBoard(){ if(!selectedId || !confirm('이 메모를 삭제할까요?')) return; const response=await fetch('/borads/'+selectedId,{method:'DELETE'}); if(response.ok){ selectedId=null; await loadBoards(); } }
    document.querySelector('#new').onclick=clearEditor; save.onclick=saveBoard; remove.onclick=deleteBoard; showClock(); setInterval(showClock,1000); loadBoards();
  </script>
</body>
</html>
