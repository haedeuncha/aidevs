name: Course CI Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-python-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --invalidation-mode 값은 checked-hash / timestamp / unchecked-hash만 허용된다.
      # 문법 검사만 하면 되므로 옵션 없이 -q(조용히)로 실행한다.
      - name: Python syntax check
        run: |
          python -m compileall -q \
            07_multi-agent-service-ops \
            08_multi-agent-service-mini-project

      - name: Validate Docker Compose config
        run: |
          set -e
          for f in \
            "07_multi-agent-service-ops/02_service-deployment-and-automation/02_docker-compose-multi-service/docker-compose.yml" \
            "07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/compose.yml"; do
            if [ -f "$f" ]; then
              echo "Checking compose file: $f"
              docker compose -f "$f" config --quiet
            else
              echo "Skip (not found): $f"
            fi
          done

      - name: Docker build validation
        run: |
          set -e
          docker build -t aidevs-course-sample \
            07_multi-agent-service-ops/02_service-deployment-and-automation/01_docker-service-packaging
