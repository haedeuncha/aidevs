<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>날씨누리 | 동네 예보</title>
    <style>
      :root { font-family: "Pretendard", "Malgun Gothic", Arial, sans-serif; color: #171b25; background: #f3f6fa; }
      * { box-sizing: border-box; } body { margin: 0; }
      header { background: #fff; border-bottom: 1px solid #dce3eb; }
      .top, main { width: min(1120px, calc(100% - 32px)); margin: auto; }
      .top { height: 76px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 1.45rem; font-weight: 800; letter-spacing: -.06em; color: #102c60; }
      .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: white; background: conic-gradient(#f5b900 0 25%, #2b83d7 0 50%, #194c99 0 75%, #7abbe6 0); }
      .updated { font-size: .82rem; color: #687386; } nav { background: #123f85; } nav div { width: min(1120px, calc(100% - 32px)); margin: auto; display: flex; gap: 30px; } nav span { padding: 14px 0; color: #fff; font-size: .92rem; font-weight: 700; }
      main { padding: 34px 0 60px; } .breadcrumb { color: #6d7787; font-size: .82rem; } h1 { margin: 13px 0 25px; font-size: 1.8rem; letter-spacing: -.07em; }
      .city-bar { padding: 18px 22px; display: flex; align-items: center; gap: 14px; border: 1px solid #dce3eb; background: #fff; } .city-bar strong { margin-right: auto; } button { border: 1px solid #b8c4d3; padding: 8px 18px; color: #33445d; background: #fff; font: inherit; cursor: pointer; } button.active { border-color: #126bc5; color: #fff; background: #126bc5; font-weight: 700; }
      .headline { margin-top: 20px; padding: 25px 30px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; color: #fff; background: linear-gradient(110deg, #0a559f, #157abf); } .icon { font-size: 4.5rem; } .headline h2 { margin: 0 0 8px; font-size: 1.25rem; } .headline p { margin: 0; color: #dcedff; } .temperature { font-size: 3.8rem; font-weight: 800; letter-spacing: -.09em; }
      .grid { display: grid; grid-template-columns: 1.45fr 1fr; gap: 20px; margin-top: 20px; } .panel { border: 1px solid #dce3eb; background: #fff; } .panel h3 { margin: 0; padding: 17px 20px; border-bottom: 1px solid #e6ebf1; font-size: 1.05rem; } .metrics { display: grid; grid-template-columns: repeat(3, 1fr); } .metric { padding: 22px 16px; text-align: center; border-right: 1px solid #e6ebf1; } .metric:last-child { border: 0; } .metric span { display: block; color: #6d7787; font-size: .84rem; } .metric b { display: block; margin-top: 8px; color: #172f59; font-size: 1.22rem; }
      .forecast { padding: 8px 20px 20px; } .row { display: grid; grid-template-columns: 70px 1fr 42px 58px; align-items: center; gap: 10px; min-height: 51px; border-bottom: 1px solid #edf0f4; } .row:last-child { border: 0; } .row span:nth-child(2) { font-size: 1.35rem; } .row b { text-align: right; } .notice { padding: 20px; color: #5a687b; line-height: 1.7; font-size: .89rem; } footer { padding: 24px; color: #778396; text-align: center; font-size: .8rem; }
      @media (max-width: 680px) { .updated, nav span:not(:first-child) { display: none; } .city-bar { flex-wrap: wrap; } .city-bar strong { width: 100%; } .headline { grid-template-columns: auto 1fr; } .temperature { grid-column: 2; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header><div class="top"><div class="brand"><span class="mark">☀</span> 날씨누리</div><span class="updated">기상정보 · Mock Weather Service</span></div><nav><div><span>날씨</span><span>특보·예보</span><span>관측자료</span><span>생활기상</span></div></nav></header>
    <main><div class="breadcrumb">홈 〉 날씨 〉 동네예보</div><h1>동네예보</h1><section class="city-bar"><strong>지역 선택</strong><button class="active" data-city="Seoul">서울</button><button data-city="Busan">부산</button><button data-city="Jeju">제주</button></section>
      <section class="headline"><div class="icon" id="icon">☀️</div><div><h2 id="city">서울</h2><p id="condition">맑음 · 현재 날씨</p></div><div class="temperature" id="temp">24°</div></section>
      <div class="grid"><section class="panel"><h3>현재 관측</h3><div class="metrics"><div class="metric"><span>체감온도</span><b id="feels">24°C</b></div><div class="metric"><span>풍속</span><b id="wind">1.8 m/s</b></div><div class="metric"><span>습도</span><b id="humidity">55%</b></div></div><div class="forecast"><div class="row"><span>오전</span><span id="morningIcon">☀️</span><span id="morningCondition">맑음</span><b id="morningTemp">22°</b></div><div class="row"><span>오후</span><span id="afternoonIcon">☀️</span><span id="afternoonCondition">맑음</span><b id="afternoonTemp">26°</b></div></div></section><aside class="panel"><h3>기상 안내</h3><div class="notice" id="notice">맑은 날씨가 이어집니다. 야외 활동 시 자외선 차단에 유의하세요.</div></aside></div>
    </main><footer>날씨 데이터 제공: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></footer>
    <script>
      function weatherInfo(code) {
        if (code === 0) return { icon: "☀️", label: "맑음", notice: "맑은 날씨입니다. 야외 활동 시 자외선 차단에 유의하세요." };
        if ([1, 2, 3].includes(code)) return { icon: "⛅", label: "구름 조금", notice: "구름이 다소 끼는 날입니다. 외출 전 최신 예보를 확인하세요." };
        if ([45, 48].includes(code)) return { icon: "🌫️", label: "안개", notice: "가시거리가 낮을 수 있습니다. 운전 시 안전거리를 확보하세요." };
        if ([51, 53, 55, 56, 57].includes(code)) return { icon: "🌦️", label: "이슬비", notice: "약한 비가 내릴 수 있습니다. 우산을 준비하세요." };
        if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { icon: "🌧️", label: "비", notice: "비가 내리고 있습니다. 우산과 미끄럼에 유의하세요." };
        if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: "❄️", label: "눈", notice: "눈이 내릴 수 있습니다. 보행과 차량 운전에 유의하세요." };
        return { icon: "⛈️", label: "뇌우", notice: "천둥·번개 가능성이 있습니다. 야외 활동을 피하세요." };
      }
      async function showWeather(city) {
        document.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.city === city));
        try {
          const response = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
          const weather = await response.json(); if (!response.ok || weather.error) throw new Error(weather.error || "요청에 실패했습니다.");
          const current = weatherInfo(weather.weather_code), morning = weatherInfo(weather.morning.weather_code), afternoon = weatherInfo(weather.afternoon.weather_code);
          document.querySelector("#icon").textContent = current.icon; document.querySelector("#city").textContent = weather.city_name;
          document.querySelector("#condition").textContent = `${current.label} · ${weather.updated_at.replace("T", " ")} 기준`; document.querySelector("#temp").textContent = `${Math.round(weather.temperature)}°`;
          document.querySelector("#feels").textContent = `${Math.round(weather.apparent_temperature)}°C`; document.querySelector("#wind").textContent = `${weather.wind_speed} km/h`; document.querySelector("#humidity").textContent = `${weather.humidity}%`;
          document.querySelector("#morningIcon").textContent = morning.icon; document.querySelector("#afternoonIcon").textContent = afternoon.icon;
          document.querySelector("#morningCondition").textContent = morning.label; document.querySelector("#afternoonCondition").textContent = afternoon.label;
          document.querySelector("#morningTemp").textContent = `${Math.round(weather.morning.temperature)}°`; document.querySelector("#afternoonTemp").textContent = `${Math.round(weather.afternoon.temperature)}°`; document.querySelector("#notice").textContent = current.notice;
        } catch (error) { document.querySelector("#notice").textContent = `날씨를 불러오지 못했습니다: ${error.message}`; }
      }
      document.querySelectorAll("button").forEach(button => button.addEventListener("click", () => showWeather(button.dataset.city)));
    </script>
  </body>
</html>
